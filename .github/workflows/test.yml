name: tests

# Nur manuell startbar: GitHub Actions ist auf diesem Account gesperrt, jeder
# automatische Lauf würde nur ein rotes X erzeugen. Wieder aktivieren, indem
# die push/pull_request-Trigger unten einkommentiert werden.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
